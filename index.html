<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:25px;
            width:350px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            color:green;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:green;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        #message{
            margin-top:15px;
            text-align:center;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Omba Mkopo</h2>

    <input type="text" id="name" placeholder="Jina Kamili">

    <input type="text" id="phone" placeholder="Namba ya Simu">

    <input type="number" id="loan_amount" placeholder="Kiasi cha Mkopo">

    <button onclick="tumaMaombi()">
        TUMA MAOMBI
    </button>

    <div id="message"></div>

</div>

<script>

async function tumaMaombi(){

    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let loan_amount = document.getElementById("loan_amount").value;

    let message = document.getElementById("message");

    message.innerHTML = "Inatuma...";

    try{

        let response = await fetch(
            "https://mkopo-wa-mixx-by-yas.onrender.com/submit-loan",
            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    name:name,
                    phone:phone,
                    loan_amount:loan_amount
                })

            }
        );

        let data = await response.json();

        message.innerHTML = data.message;

    }catch(error){

        console.log(error);

        message.innerHTML = "Backend error";

    }

}

</script>

</body>
</html>
